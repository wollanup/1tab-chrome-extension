<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Toolbar variant (16 and 32 px, i.e. 16 px on HiDPI screens): the tabs are too thin to read at this size -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="16" height="16" rx="3.5" fill="url(#bg)"/>
  <g fill="#fbbf24">
    <rect x="4" y="4" width="3" height="8" rx=".75"/>
    <rect x="9" y="4" width="3" height="8" rx=".75"/>
  </g>
</svg>
