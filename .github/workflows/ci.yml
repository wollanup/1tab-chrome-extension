name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run check
      - run: npm test

  e2e:
    name: End-to-end tests (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Google Chrome is preinstalled on GitHub-hosted Ubuntu runners.
      - run: google-chrome --version
      - run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
