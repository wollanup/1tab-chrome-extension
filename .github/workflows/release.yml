name: Release

# Push a tag matching the manifest version (e.g. v2.0.0) to publish a release
# with the packaged extension.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test

      - name: Check that the tag matches the manifest version
        run: |
          version=$(node -p "require('./src/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Package the extension
        run: |
          mkdir -p dist
          cd src && zip -r -X "../dist/1tab-$GITHUB_REF_NAME.zip" . -x 'icons/*.svg'

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "1Tab $GITHUB_REF_NAME" --generate-notes
