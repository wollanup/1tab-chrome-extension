<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title data-i18n="extName">1Tab</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="popup.js"></script>
</head>
<body class="popup">
<header class="popup-header">
    <img src="icons/icon32.png" width="24" height="24" alt="">
    <h1 data-i18n="popupTitle"></h1>
</header>

<section class="card card-warning" id="current" hidden>
    <p id="currentText"></p>
    <div class="actions">
        <button type="button" class="btn btn-primary" id="goToOther" data-i18n="goToOther"></button>
        <button type="button" class="btn" id="closeCurrent" data-i18n="closeCurrent"></button>
    </div>
</section>

<section class="duplicates">
    <div class="section-head">
        <h2 data-i18n="duplicatesTitle"></h2>
        <button type="button" class="btn btn-small" id="closeAll" hidden></button>
    </div>
    <ul class="groups" id="groups"></ul>
    <p class="muted small" id="noDuplicates" data-i18n="noDuplicates" hidden></p>
</section>

<details class="settings" id="settings">
    <summary data-i18n="settingsTitle"></summary>
    <div class="settings-body">
        <div class="field">
            <label for="mode" data-i18n="compareMode"></label>
            <select id="mode">
                <option value="exact" data-i18n="modeExact"></option>
                <option value="path" data-i18n="modePath"></option>
                <option value="domain" data-i18n="modeDomain"></option>
            </select>
            <a href="help.html" target="_blank" class="small" data-i18n="helpLink"></a>
        </div>
        <label class="check">
            <input type="checkbox" id="autoSwitch">
            <span>
                <span data-i18n="autoSwitchLabel"></span>
                <span class="muted small" data-i18n="autoSwitchHint"></span>
            </span>
        </label>
    </div>
</details>

<p class="paused-notice" data-i18n="paused" role="status"></p>

<footer class="popup-footer small">
    <button type="button" class="btn btn-small btn-pause" id="pauseBtn">
        <svg class="icon-pause" viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="4" width="4" height="12" rx="1.5"/><rect x="12" y="4" width="4" height="12" rx="1.5"/></svg>
        <svg class="icon-play" viewBox="0 0 20 20" aria-hidden="true"><polygon points="6,4 16,10 6,16"/></svg>
        <span id="pauseLabel"></span>
    </button>
    <span class="footer-links">
        <a href="https://github.com/wollanup/1tab-chrome-extension/" target="_blank" rel="noopener" data-i18n="footerGithub"></a>
        <a href="https://ko-fi.com/wollanup" target="_blank" rel="noopener" data-i18n="footerDonation"></a>
    </span>
</footer>

<template id="groupTemplate">
    <li class="group">
        <div class="group-row">
            <button type="button" class="group-link">
                <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true" hidden><path d="M6 4l4 4-4 4"/></svg>
                <img class="favicon" width="16" height="16" alt="">
                <span class="group-title"></span>
            </button>
            <span class="group-count"></span>
            <button type="button" class="btn-icon group-close">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
            </button>
        </div>
        <ul class="group-tabs" hidden></ul>
    </li>
</template>

<template id="tabTemplate">
    <li class="group-tab">
        <button type="button" class="group-tab-link">
            <span class="group-tab-title"></span>
            <span class="group-tab-url muted small"></span>
        </button>
        <span class="kept-tag small" hidden></span>
        <button type="button" class="btn-icon tab-close">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
    </li>
</template>
</body>
</html>
